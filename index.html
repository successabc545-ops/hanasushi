<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HANA SUSHI CRM</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

<style>
body{margin:0;font-family:Poppins,sans-serif;background:#000;color:#fff;}
section{padding:80px 10%;}
.section-title{color:#ff2e2e;font-size:32px;margin-bottom:20px;}
nav{position:fixed;top:0;width:100%;background:#000;display:flex;justify-content:space-between;padding:15px 30px;z-index:999;}
nav a{color:#fff;margin-left:15px;text-decoration:none;}
.hero{height:60vh;background:url('sushi.webp') center/cover;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;}
.hero h1{font-size:60px;}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;}
.menu-item{background:#111;padding:10px;border-radius:10px;}
.menu-item img{width:100%;border-radius:10px;}
.price{color:#ffb703;}
#map{height:400px;}
input,select,textarea{width:100%;padding:10px;margin:8px 0;border-radius:6px;border:none;}
button{padding:12px 20px;background:#ff2e2e;color:#fff;border:none;border-radius:8px;cursor:pointer;}
button:hover{background:#ffb703;color:#000;}
#order-summary{position:fixed;bottom:20px;right:20px;background:#111;padding:15px;border-radius:10px;width:300px;display:none;}
</style>
</head>

<body>

<!-- NAV -->
<nav>
<div>HANA SUSHI</div>
<div>
<a href="#home">Home</a>
<a href="#menu">Menu</a>
<a href="#contact">Contact</a>
</div>
</nav>

<!-- HERO -->
<section class="hero" id="home">
<h1>HANA SUSHI</h1>
<p>Food Truck CRM System</p>
</section>

<!-- MENU (simplified) -->
<section id="menu">
<h2 class="section-title">Menu</h2>
<div class="menu-grid">
<div class="menu-item"><img src="fire roll.webp"><h3>Fire Roll</h3><p class="price">$12.95</p></div>
<div class="menu-item"><img src="california.webp"><h3>California Roll</h3><p class="price">$9.95</p></div>
</div>
</section>

<!-- CONTACT + CRM -->
<section id="contact">
<h2 class="section-title">Customer & Order</h2>

<form id="customerForm">

<h3>Customer Info</h3>
<input type="text" name="name" placeholder="Name" required>
<input type="tel" name="phone" placeholder="Phone Number" required>

<select name="customer_type">
<option value="guest">Guest</option>
<option value="regular">Regular</option>
<option value="vip">VIP</option>
</select>

<h3>Order Message</h3>
<textarea name="message" placeholder="Order details"></textarea>

<button type="submit">Submit</button>
</form>

<div id="map"></div>
</section>

<!-- ORDER BOX -->
<div id="order-summary">
<h3>Saved</h3>
<p id="status">Waiting...</p>
</div>

<!-- FIREBASE CRM -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, increment } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
</html>
