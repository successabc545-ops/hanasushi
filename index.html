<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HANA SUSHI FOOD TRUCK</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Poppins', sans-serif; margin:0; padding:0; background:#fff; }
  header { background:#f44336; color:#fff; padding:20px; text-align:center; }
  h1 { margin:0; }
  .menu { display:flex; flex-wrap:wrap; justify-content:center; padding:20px; gap:20px; }
  .menu-item { border:1px solid #ddd; border-radius:10px; padding:15px; width:200px; text-align:center; }
  .menu-item img { width:100%; border-radius:10px; cursor:zoom-in; transition: transform 0.3s; }
  .menu-item img:hover { transform: scale(1.5); z-index:2; position:relative; }
  .menu-item h3 { margin:10px 0 5px 0; }
  .menu-item p { margin:5px 0; }
  .menu-item input { width:50px; }
  #total { text-align:center; font-size:1.2em; margin:20px 0; }
  #order-form { max-width:400px; margin:0 auto 50px auto; padding:20px; border:1px solid #ddd; border-radius:10px; }
  #order-form input, #order-form button { width:100%; padding:10px; margin:5px 0; }
  button { background:#f44336; color:#fff; border:none; cursor:pointer; font-size:1em; border-radius:5px; }
</style>
</head>
<body>

<header>
  <h1>HANA SUSHI FOOD TRUCK</h1>
</header>

<section class="menu">
  <div class="menu-item">
    <img src="https://images.unsplash.com/photo-1553621042-f6e147245754?auto=format&fit=crop&w=800&q=80" alt="Burito">
    <h3>🌯 Burito</h3>
    <p>Price: $12.00</p>
    <input type="number" min="0" value="0" class="qty" data-price="12">
  </div>
  <div class="menu-item">
    <img src="https://images.unsplash.com/photo-1562967916-eb82221dfb26?auto=format&fit=crop&w=800&q=80" alt="Sushi Combo">
    <h3>🍣 Sushi Combo</h3>
    <p>Price: $15.00</p>
    <input type="number" min="0" value="0" class="qty" data-price="15">
  </div>
  <div class="menu-item">
    <img src="https://images.unsplash.com/photo-1617196035740-9b84e1b5c217?auto=format&fit=crop&w=800&q=80" alt="Drink">
    <h3>🥤 Drink</h3>
    <p>Price: $3.50</p>
    <input type="number" min="0" value="0" class="qty" data-price="3.5">
  </div>
</section>

<div id="total">Total: $0.00</div>

<section id="order-form">
  <h2>Order Now</h2>
  <input type="text" id="name" placeholder="Your Name" required>
  <input type="email" id="email" placeholder="Your Email" required>
  <button id="submit-order">Place Order</button>
</section>

<script>
const qtyInputs = document.querySelectorAll('.qty');
const totalDiv = document.getElementById('total');

function calculateTotal() {
  let subtotal = 0;
  qtyInputs.forEach(input => {
    const price = parseFloat(input.dataset.price);
    const qty = parseInt(input.value) || 0;
    subtotal += price * qty;
  });
  const tax = subtotal * 0.0725; // 7.25% tax
  const total = subtotal + tax;
  totalDiv.textContent = `Total: $${total.toFixed(2)} (Tax included)`;
}

qtyInputs.forEach(input => {
  input.addEventListener('input', calculateTotal);
});

document.getElementById('submit-order').addEventListener('click', () => {
  const name = document.getElementById('name').value;
  const email = document.getElementById('email').value;
  if (!name || !email) { alert('Please fill your name and email.'); return; }

  let orderDetails = '';
  qtyInputs.forEach(input => {
    const qty = parseInt(input.value) || 0;
    if (qty > 0) {
      const item = input.closest('.menu-item').querySelector('h3').textContent;
      orderDetails += `${item} x${qty}\n`;
    }
  });
  orderDetails += `\n${totalDiv.textContent}`;

  // 이메일 전송 (mailto 사용)
  const mailtoLink = `mailto:${email}?subject=HANA SUSHI Order&body=Hello ${name},%0D%0A%0D%0AHere is your order:%0D%0A${encodeURIComponent(orderDetails)}`;
  window.location.href = mailtoLink;
  alert('Order prepared! Check your email.');
});
</script>

</body>
</html>
