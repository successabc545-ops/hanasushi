<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eatHANASUSHIla</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<style>
/* ===== 전체 스타일 ===== */
body, html { margin:0; padding:0; font-family:'Poppins',sans-serif; background:#000; color:#fff; scroll-behavior:smooth;}
nav{position:fixed;top:0;width:100%;background:rgba(0,0,0,0.85);display:flex;justify-content:space-between;align-items:center;padding:15px 40px;z-index:1000;}
nav a{color:#fff;text-decoration:none;margin-left:20px;cursor:pointer;}
.logo {font-weight:700; font-size:1.5em;}
header{height:500px; display:flex; justify-content:center; align-items:center; background: url('your-banner.jpg') center/cover no-repeat;}
h1,h2{margin:0 0 20px 0;}
section{padding:60px 40px;}
.menu-item{display:inline-block; width:200px; margin:20px; text-align:center;}
.menu-item img{width:100%; height:auto; border-radius:15px; transition: transform 0.3s ease, box-shadow 0.3s ease;}
.menu-item img:hover{transform: scale(1.1); box-shadow: 0 10px 20px rgba(0,0,0,0.5); cursor:pointer;}
#map{width:100%; height:500px; border-radius:15px;}
footer{padding:20px; text-align:center; background:#111;}
</style>
</head>
<body>

<nav>
  <div class="logo">HANA SUSHI 🚚</div>
  <div>
    <a href="#menu">Menu</a>
    <a href="#map">Food Truck</a>
    <a id="scroll-map">Current Food Truck Location</a>
  </div>
</nav>

<header>
  <h1>Welcome to HANA SUSHI FOOD TRUCK</h1>
</header>

<section id="menu">
  <h2>Our Menu</h2>
  <div class="menu-item">
    <img src="sushi1.jpg" alt="Sushi">
    <p>Sushi Deluxe</p>
  </div>
  <div class="menu-item">
    <img src="ricecracker.jpg" alt="Rice Cracker">
    <p>Rice Cracker</p>
  </div>
  <div class="menu-item">
    <img src="burrito.jpg" alt="Burrito">
    <p>Burrito Sushi</p>
  </div>
</section>

<section id="map-section">
  <h2>Food Truck Location</h2>
  <div id="map"></div>
</section>

<footer>
  &copy; 2026 HANA SUSHI. All Rights Reserved.
</footer>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
  // ===== 지도 초기화 =====
  const map = L.map('map').setView([34.0195, -118.4912], 14);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

  // ===== 트럭 마커 =====
  const truckMarker = L.marker([34.0195, -118.4912])
    .addTo(map)
    .bindPopup("<b>HANA SUSHI FOOD TRUCK</b><br>Food Truck is here")
    .openPopup();

  // ===== 트럭 경로 =====
  const truckPath = [
    [34.0195, -118.4912],
    [34.0200, -118.4905],
    [34.0205, -118.4900],
    [34.0210, -118.4895],
    [34.0215, -118.4890]
  ];
  let pathIndex = 0;

  // ===== 트럭 자동 이동 =====
  setInterval(() => {
    pathIndex++;
    if (pathIndex >= truckPath.length) pathIndex = 0;
    const newLatLng = truckPath[pathIndex];
    truckMarker.setLatLng(newLatLng).openPopup();
    map.panTo(newLatLng);
  }, 3000);

  // ===== 사용자 위치 =====
  let userMarker = null;
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(pos => {
      const userLatLng = [pos.coords.latitude, pos.coords.longitude];
      userMarker = L.marker(userLatLng).addTo(map).bindPopup("You are here").openPopup();
    });
  }

  // ===== 버튼 클릭 시 트럭 & 사용자 위치 =====
  const scrollMapBtn = document.getElementById('scroll-map');
  scrollMapBtn.addEventListener('click', () => {
    map.flyTo(truckPath[pathIndex], 16);
    truckMarker.openPopup();
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(pos => {
        const userLatLng = [pos.coords.latitude, pos.coords.longitude];
        if (!userMarker) {
          userMarker = L.marker(userLatLng).addTo(map).bindPopup("You are here").openPopup();
        } else {
          userMarker.setLatLng(userLatLng).bindPopup("You are here").openPopup();
        }
      });
    }
  });
</script>

</body>
</html>
