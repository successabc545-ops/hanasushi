    body { font-family: Arial; padding: 20px; }

<body>

<h2>🍣 Hana Sushi Admin Panel</h2>

<!-- 고객 검색 -->
<input id="phone" placeholder="Customer ID (phone)" />
<button onclick="searchCustomer()">Search</button>

<div id="result"></div>

<hr />

<h3>➕ QR / 방문 체크</h3>
<button onclick="checkIn()">Visit +1</button>

<h3>🎁 Coupon System</h3>
<button onclick="giveCoupon()">Give Coupon</button>

<script>
// Firebase 설정 (여기 너 프로젝트로 유지)
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "hanasushi-54d82.firebaseapp.com",
  projectId: "hanasushi-54d82",
  storageBucket: "hanasushi-54d82.appspot.com",
  messagingSenderId: "XXX",
  appId: "XXX"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

let currentUser = null;

// 고객 검색
async function searchCustomer() {
  const id = document.getElementById("phone").value;
  const doc = await db.collection("customers").doc(id).get();

  if (!doc.exists) {
    document.getElementById("result").innerHTML = "No customer found";
    currentUser = null;
    return;
  }

  currentUser = id;
  const data = doc.data();

  document.getElementById("result").innerHTML = `
    <div class="card">
      <p>📞 ID: ${id}</p>
      <p>👣 Visits: ${data.visits || 0}</p>
      <p>🎟 Coupon: ${data.coupon}</p>
    </div>
  `;
}

// 방문 +1
async function checkIn() {
  if (!currentUser) return alert("Search customer first");

  const ref = db.collection("customers").doc(currentUser);

  await ref.set({
    visits: firebase.firestore.FieldValue.increment(1)
  }, { merge: true });

  searchCustomer();
}
