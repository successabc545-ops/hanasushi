<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hana Sushi Location</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<style>
  body, html { margin:0; padding:0; height:100%; }
  #map { width:100%; height:100%; }
</style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
  // Hana Sushi 좌표 (예시)
  const hanaLat = 34.0183; // 실제 위치로 바꿔도 됨
  const hanaLng = -118.4853;

  // 지도 초기화
  const map = L.map('map').setView([hanaLat, hanaLng], 16);

  // OpenStreetMap 타일
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // Hana Sushi 마커
  L.marker([hanaLat, hanaLng])
      .addTo(map)
      .bindPopup("🍣 Hana Sushi")
      .openPopup();
</script>

</body>
</html>
