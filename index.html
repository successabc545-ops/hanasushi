<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eatHANASUSHIla</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>

*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Poppins',sans-serif;background:#000;color:#fff;}

nav{
position:fixed;
top:0;
width:100%;
background:rgba(0,0,0,0.85);
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 40px;
z-index:1000;
}

nav .logo{font-size:20px;font-weight:700;letter-spacing:2px;}
nav a{color:#fff;text-decoration:none;margin-left:20px;font-weight:500;cursor:pointer;}
nav a:hover{color:#ff2e2e;}

.hero{
height:60vh;
background:linear-gradient(120deg, rgba(0,0,0,0.75), rgba(255,0,0,0.35)),
url('https://images.unsplash.com/photo-1604908177522-0404c2d9d9e7?auto=format&fit=crop&w=800&q=80');
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
}

.hero h1{font-size:70px;letter-spacing:5px;}
.hero h2{color:#ffb703;font-size:28px;margin-top:10px;}
.hero p{font-size:20px;margin:20px 0 35px;}

section{padding:100px 10%;}

.section-title{font-size:38px;color:#ff2e2e;margin-bottom:20px;}

.menu-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
}

.menu-item{
background:#111;
border-radius:15px;
overflow:hidden;
cursor:pointer;
text-align:center;
padding-bottom:10px;
}

.menu-item img{
width:100%;
transition:0.3s;
}

.menu-item img:hover{
transform:scale(1.1);
}

.big-title{
font-size:28px;
font-weight:900;
text-shadow:0 0 10px #ff2e2e;
}

/* sashimi 선택 */

.sashimi-option{
border:2px solid transparent;
transition:0.2s;
}

.sashimi-option.selected{
border:2px solid #ff2e2e;
box-shadow:0 0 15px #ff2e2e;
}

/* 주문 박스 */

#order-summary{
position:fixed;
bottom:20px;
right:20px;
width:340px;
background:#111;
padding:20px;
border-radius:15px;
z-index:999;
}

#order-summary h2{
text-align:center;
color:#ff2e2e;
margin-bottom:15px;
}

#selected-items div{
margin-bottom:5px;
}

button{
background:#ff2e2e;
border:none;
padding:5px 10px;
color:#fff;
cursor:pointer;
border-radius:5px;
}

button:hover{
background:#ffb703;
color:#000;
}

</style>
</head>

<body>

<nav>
<div class="logo">HANA SUSHI 🚚</div>
<div>
<a href="#menu">Menu</a>
</div>
</nav>

<section class="hero">
<div>
<h1>HANA SUSHI</h1>
<h2>FOOD TRUCK</h2>
<p>Japanese Street Sushi</p>
</div>
</section>

<section id="menu">

<h2 class="section-title">Popular Food</h2>

<div class="menu-grid">

<div class="menu-item">
<img src="1.Burito.webp">
<h3>🌯 Burito</h3>
</div>

<div class="menu-item">
<img src="Smoked_Burito.webp">
<h3>🌯 Smoked Burito</h3>
</div>

</div>

</section>

<!-- sashimi -->

<section id="sashimi">

<h2 class="section-title">Sashimi</h2>

<div class="menu-grid">

<div class="menu-item sashimi-main">
<img src="special sashimi.webp">
<h3 class="big-title">🍣 Special Sashimi</h3>
<p>Choose up to 5</p>
</div>

</div>

<div id="sashimi-options" style="display:none;margin-top:30px">

<div class="menu-grid">

<div class="menu-item sashimi-option" data-name="Salmon Sashimi">
<img src="salmon.webp">
<h3>Salmon</h3>
</div>

<div class="menu-item sashimi-option" data-name="Tuna Sashimi">
<img src="tuna.webp">
<h3>Tuna</h3>
</div>

<div class="menu-item sashimi-option" data-name="Yellowtail Sashimi">
<img src="yellowtail.webp">
<h3>Yellowtail</h3>
</div>

<div class="menu-item sashimi-option" data-name="Octopus Sashimi">
<img src="octopus.webp">
<h3>Octopus</h3>
</div>

<div class="menu-item sashimi-option" data-name="Scallop Sashimi">
<img src="scallop.webp">
<h3>Scallop</h3>
</div>

</div>
</div>

</section>

<!-- 주문 -->

<div id="order-summary">

<h2>Your Order</h2>

<div id="selected-items"></div>

<p>Subtotal: $<span id="subtotal">0</span></p>
<p>Tax: $<span id="tax">0</span></p>
<p>Total: $<span id="total">0</span></p>

</div>

<script>

const menuPrices={
"🌯 Burito":50,
"🌯 Smoked Burito":100
};

const selectedItems={};

document.querySelectorAll('.menu-item').forEach(item=>{

const name=item.querySelector('h3')?.innerText;

item.addEventListener('click',()=>{

if(menuPrices[name]){

if(selectedItems[name]) selectedItems[name]++;
else selectedItems[name]=1;

updateOrderSummary();

}

});

});

function updateOrderSummary(){

const div=document.getElementById('selected-items');

div.innerHTML='';

let subtotal=0;

for(const [name,qty] of Object.entries(selectedItems)){

const price=menuPrices[name]||0;

subtotal+=price*qty;

const line=document.createElement('div');

line.innerText=`${name} x${qty} - $${price*qty}`;

div.appendChild(line);

}

const tax=subtotal*0.095;
const total=subtotal+tax;

document.getElementById('subtotal').innerText=subtotal.toFixed(2);
document.getElementById('tax').innerText=tax.toFixed(2);
document.getElementById('total').innerText=total.toFixed(2);

}

/* sashimi */

const sashimiMain=document.querySelector('.sashimi-main');
const sashimiOptions=document.getElementById('sashimi-options');

sashimiMain.addEventListener('click',()=>{

sashimiOptions.style.display=
sashimiOptions.style.display==='none'?'block':'none';

});

const sashimiPrices={
"Salmon Sashimi":20,
"Tuna Sashimi":22,
"Yellowtail Sashimi":24,
"Octopus Sashimi":18,
"Scallop Sashimi":26
};

let sashimiCount=0;

document.querySelectorAll('.sashimi-option').forEach(item=>{

item.addEventListener('click',()=>{

const name=item.dataset.name;

if(item.classList.contains('selected')){

item.classList.remove('selected');

sashimiCount--;

delete selectedItems[name];

}else{

if(sashimiCount>=5){

alert("You can choose up to 5 sashimi");

return;

}

item.classList.add('selected');

sashimiCount++;

selectedItems[name]=1;

menuPrices[name]=sashimiPrices[name];

}

updateOrderSummary();

});

});

</script>

</body>
</html>
