<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>HANA SUSHI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>

<link rel="stylesheet" href="styles.css">
</head>

<body>

<!-- INTRO -->
<div id="vegas-intro">
  <div class="neon-sign">
    HANA SUSHI
    <span>Thank You for your order!</span>
  </div>
</div>

<!-- NAV -->
<nav>
  <div class="logo">HANA SUSHI 🚚</div>
  <div>
    <a href="#home">Home</a>
    <a href="#about">Story</a>
    <a href="#menu">Menu</a>
    <a href="#contact">Contact us</a>
    <a id="scroll-map">Current Food Truck Location</a>
    <a href="#qr">QR</a>
  </div>
</nav>

<!-- HERO -->
<section class="hero" id="home">
  <div>
    <h1>HANA SUSHI</h1>
    <h2>FOOD TRUCK (213)793-9978</h2>
    <p>🔥 Japanese Street Sushi • Bold Flavors on Wheels</p>
  </div>
</section>

<!-- ABOUT -->
<section id="about">
  <h2 class="section-title">Our Story</h2>
  <p class="about">HANA SUSHI Food Truck brings bold Japanese flavors...</p>
</section>

<a href="kiosky.html"><button>Kiosk Mode</button></a>

<!-- MENU / RAMEN / SASHIMI ... (그대로 유지) -->
<!-- ↓↓↓ 여기부터 너 코드 그대로 붙여넣기 ↓↓↓ -->

<!-- CONTACT -->
<section id="contact">
  <h2 class="section-title">Contact Us</h2>

  <div class="contact-box">
    <form action="https://formsubmit.co/koseouk@gmail.com" method="POST">

      <input type="tel" id="phoneFull" name="phone" placeholder="Phone" required>
      <input type="text" name="name" placeholder="Name" required>
      <input type="email" name="email" placeholder="Email" required>

      <input type="date" id="eventDate" name="event_date" required>

      <textarea name="message" rows="4"></textarea>

      <button type="submit">Send</button>
    </form>

    <div id="map"></div>
  </div>
</section>

<!-- QR -->
<section id="qr">
  <div class="qr-card">
    <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://eathanasushila.com">
  </div>
</section>

<!-- ORDER BOX -->
<div id="order-summary">
  <h2>Your Order</h2>
  <div id="selected-items"></div>
  <p>Total: $<span id="total">0.00</span></p>
  <button id="send-order">Send Order</button>
  <div id="order-message"></div>
</div>

<!-- IDLE AD -->
<div id="idleAd">
  <video autoplay muted loop playsinline>
    <source src="hello.mp4">
  </video>
</div>

<!-- SCRIPTS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<script type="module" src="firebase.js"></script>
<script src="app.js"></script>

</body>

<script type="module" src="firebase.js"></script>
  
</html>
