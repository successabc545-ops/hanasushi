<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hana Sushi</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  color: white;
}

/* Top Menu */
nav {
  position: fixed;
  top: 0;
  width: 100%;
  padding: 15px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(0,0,0,0.6);
  z-index: 10;
}

nav a {
  color: white;
  margin-left: 20px;
  text-decoration: none;
  font-weight: bold;
}

/* Hero Section */
.hero {
  height: 100vh;
  background: url('https://images.unsplash.com/photo-1553621042-f6e147245754') center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
}

.hero h1 {
  font-size: 60px;
  margin-bottom: 10px;
}

.hero p {
  font-size: 20px;
  margin-bottom: 30px;
}

.hero button {
  padding: 12px 28px;
  border: none;
  background: #cfa349;
  color: black;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.hero button:hover {
  background: white;
}
</style>
</head>
<body>

<nav>
  <div><b>HANA SUSHI</b></div>
  <div>
    <a href="#">Home</a>
    <a href="#">Menu</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </div>
</nav>

<section class="hero">
  <div>
    <h1>HANA SUSHI</h1>
    <p>Fresh • Authentic • Japanese Cuisine</p>
    <button>View Menu</button>

  /div>
</section>

</body>
</html>
