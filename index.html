<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HANA SUSHI FOOD TRUCK</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />

<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Poppins',sans-serif;background:#000;color:#fff;}

nav{
  position:fixed;top:0;width:100%;
  background:rgba(0,0,0,0.85);
  display:flex;justify-content:space-between;align-items:center;
  padding:15px 40px;z-index:1000;
}
nav .logo{font-size:20px;font-weight:700;letter-spacing:2px;}
nav a{color:#fff;text-decoration:none;margin-left:20px;font-weight:500;cursor:pointer;}
nav a:hover{color:#ff2e2e;}

.hero{
  height:100vh;
  background:linear-gradient(120deg, rgba(0,0,0,0.75), rgba(255,0,0,0.35));
  display:flex;justify-content:center;align-items:center;text-align:center;
}
.hero h1{font-size:70px;letter-spacing:5px;}
.hero h2{color:#ffb703;font-size:28px;margin-top:10px;}
.hero p{font-size:20px;margin:20px 0 35px;}

section{padding:100px 10%;}
.section-title{font-size:38px;color:#ff2e2e;margin-bottom:20px;}

.menu-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:25px;
}
.menu-item{
  background:#111;
  border-radius:15px;
  overflow:hidden;
  text-align:center;
}

/* ⭐ Sushi Burito 이미지 (확실히 보이게 외부 이미지 사용) */
.popular-burito{
  width:100%;
  height:200px;
  background-image:url('https://images.unsplash.com/photo-1617196037304-5e9b8d8f6f38?auto=format&fit=crop&w=900&q=80');
  background-size:cover;
  background-position:center;
}

.menu-item img{
  width:100%;
  height:200px;
  object-fit:cover;
  filter:brightness(0.8);
}
.menu-item h3{
  padding:15px;
  color:#ffb703;
}

.contact-box{max-width:500px;}
.contact-box input,
.contact-box textarea,
.contact-box select{
  width:100%;
  padding:12px;
  margin:10px 0;
  border:none;
  border-radius:6px;
}

.contact-box button{
  padding:12px 28px;
  border:none;
  background:#ff2e2e;
  color:#fff;
  border-radius:8px;
  cursor:pointer;
}
.contact-box button:hover{
  background:#ffb703;
  color:#000;
}

#map{
  width:100%;
  height:400px;
  border-radius:10px;
  margin-top:20px;
}

.qr-section{
  background:#111;
  text-align:center;
  padding:60px 20px;
}
.qr-section h2{
  font-size:32px;
  color:#ff2e2e;
  margin-bottom:15px;
}
.qr-section img{
  width:250px;
  height:250px;
  border:5px solid #ff2e2e;
  border-radius:15px;
}

footer{
  text-align:center;
  padding:30px;
  background:#111;
  color:#777;
}
</style>
</head>

<body>

<nav>
  <div class="logo">HANA SUSHI 🚚</div>
  <div>
    <a href="#home">Home</a>
    <a href="#menu">Menu</a>
    <a href="#contact">Contact</a>
    <a href="#qr">QR</a>
  </div>
</nav>

<section class="hero" id="home">
  <div>
    <h1>HANA SUSHI</h1>
    <h2>FOOD TRUCK</h2>
    <p>🔥 Japanese Street Sushi • Bold Flavors on Wheels</p>
  </div>
</section>

<section id="menu">
  <h2 class="section-title">Popular Items</h2>

  <div class="menu-grid">

    <div class="menu-item">
      <div class="popular-burito"></div>
      <h3>🌯 Sushi Burito</h3>
    </div>

    <div class="menu-item">
      <img src="https://images.unsplash.com/photo-1553621042-f6e147245754?auto=format&fit=crop&w=900&q=80">
      <h3>🔥 Spicy Tuna Roll</h3>
    </div>

    <div class="menu-item">
      <img src="https://images.unsplash.com/photo-1607305387299-a3d9611cd469?auto=format&fit=crop&w=900&q=80">
      <h3>🥑 Avocado Crunch Roll</h3>
    </div>

  </div>
</section>

<section id="contact">
  <h2 class="section-title">Contact Us</h2>

  <form class="contact-box"
    action="https://formsubmit.co/koseouk@gmail.com"
    method="POST">

    <input type="text" name="name" placeholder="Your Name" required>
    <input type="tel" name="phone" placeholder="Your Phone Number" required>
    <input type="email" name="email" placeholder="Your Email" required>

    <textarea name="message" rows="4" placeholder="How can we help you?" required></textarea>

    <input type="hidden" name="_captcha" value="false">
    <button type="submit">Send Message</button>
  </form>

  <div id="map"></div>
</section>

<section id="qr" class="qr-section">
  <h2>Scan & Visit Our Site</h2>
  <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https://successabc545-ops.github.io/hanasushi/">
</section>

<footer>
  © 2026 HANA SUSHI FOOD TRUCK
</footer>

<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([34.0195,-118.4912],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
L.marker([34.0195,-118.4912]).addTo(map).bindPopup("HANA SUSHI FOOD TRUCK");
</script>

</body>
</html>
