<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>eatHANASUSHIla</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Poppins',sans-serif;background:#000;color:#fff;}
nav{position:fixed;top:0;width:100%;background:rgba(0,0,0,0.85);display:flex;justify-content:space-between;align-items:center;padding:15px 40px;z-index:1000;}
nav .logo{font-size:20px;font-weight:700;letter-spacing:2px;}
nav a{color:#fff;text-decoration:none;margin-left:20px;font-weight:500;cursor:pointer;}
nav a:hover{color:#ff2e2e;}
.hero{height:60vh;background:url('https://images.unsplash.com/photo-1617196030734-9dfc4e0e4d97?auto=format&fit=crop&w=1200&q=80');background-size:cover;background-position:center;display:flex;justify-content:center;align-items:center;text-align:center;}
.hero h1{font-size:70px;letter-spacing:5px;}
.hero h2{color:#ffb703;font-size:28px;margin-top:10px;}
.hero p{font-size:20px;margin:20px 0 35px;}
.hero button{padding:14px 35px;border:none;background:#ff2e2e;color:#fff;font-size:16px;border-radius:8px;cursor:pointer;}
.hero button:hover{background:#ffb703;color:#000;}
section{padding:100px 10%;}
.section-title{font-size:38px;color:#ff2e2e;margin-bottom:20px;}
.about{max-width:800px;line-height:1.8;font-size:18px;}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:25px;}
.menu-item{background:#111;border-radius:15px;overflow:hidden;cursor:pointer;}
.menu-item img{width:100%;height:auto;object-fit:contain;transition: transform 0.3s ease, box-shadow 0.3s ease;border-radius:12px;}
.menu-item img:hover{transform:scale(1.15);z-index:5;position:relative;box-shadow:0 0 20px rgba(255,46,46,0.6),0 0 40px rgba(255,193,7,0.4);}
.contact-box{max-width:500px;}
.contact-box input,.contact-box textarea,.contact-box select{width:100%;padding:12px;margin:10px 0;border:none;border-radius:6px;}
.contact-box button{padding:12px 28px;border:none;background:#ff2e2e;color:#fff;border-radius:8px;cursor:pointer;}
.contact-box button:hover{background:#ffb703;color:#000;}
#map{width:100%;height:400px;border-radius:10px;margin-top:20px;}
.qr-section{background:#111;text-align:center;padding:60px 20px;}
.qr-section h2{font-size:32px;color:#ff2e2e;margin-bottom:15px;}
.qr-card{background:linear-gradient(145deg,#111,#1c1c1c);padding:28px;border-radius:22px;box-shadow:0 0 15px rgba(255,46,46,0.4),0 0 30px rgba(255,46,46,0.2);border:1px solid rgba(255,255,255,0.1);position:relative;overflow:hidden;transition: transform 0.3s ease, box-shadow 0.3s ease;display:inline-block;}
.qr-card:hover{transform:scale(1.05);box-shadow:0 0 25px rgba(255,46,46,0.6),0 0 50px rgba(255,46,46,0.4);}
.neon-bg-soft::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 25% 25%, rgba(255,46,46,0.15), rgba(255,193,7,0.1), rgba(255,140,0,0.05), transparent);animation:neonSoftBlink 3.5s infinite alternate;z-index:0;}
@keyframes neonSoftBlink{0%{opacity:0.2;transform:scale(1);}50%{opacity:0.35;transform:scale(1.02);}100%{opacity:0.2;transform:scale(1);}}
.qr-main{position:relative;z-index:2;background:#fff;padding:14px;border-radius:18px;width:260px;height:260px;border:5px solid #ff2e2e;display:block;margin:0 auto;}
footer{text-align:center;padding:30px;background:#111;color:#777;}

/* ==================== 모바일 대응 (안전) ==================== */
@media (max-width:768px){
  .hero{height:50vh;padding:20px;}
  .hero h1{font-size:40px;}
  .hero h2{font-size:18px;}
  .hero p{font-size:16px;}
  .menu-grid{grid-template-columns:1fr;gap:15px;}
  .qr-main{width:80%;max-width:260px;height:auto;}
  section{padding:60px 5%;}
  #map{height:300px;}
  .contact-box form,#map{flex:1 1 100%;min-width:unset;}
  #order-summary{width:90%;bottom:15px;right:5%;padding:15px;}
}
</style>
</head>
<body>
<!-- 여기에 기존 HTML 내용 그대로 유지 -->
</body>
</html>
