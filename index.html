<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 위치 지도</title>
<style>
  #map {
    width: 100%;
    max-width: 600px;
    height: 400px;
    margin: 20px auto;
    border: 3px solid red;
    border-radius: 10px;
  }
</style>
</head>
<body>

<div id="map"></div>

<script>
function initMap() {
  // 지도 기본 위치: LA 중심 (사용자 허용 전 기본값)
  const defaultLocation = { lat: 34.0522, lng: -118.2437 };

  const map = new google.maps.Map(document.getElementById("map"), {
    zoom: 14,
    center: defaultLocation,
  });

  // 브라우저에서 위치 가져오기
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      (position) => {
        const userPos = {
          lat: position.coords.latitude,
          lng: position.coords.longitude,
        };
        // 지도 중앙을 내 위치로 이동
        map.setCenter(userPos);

        // 빨간 마커 표시
        new google.maps.Marker({
          position: userPos,
          map: map,
          title: "내 위치",
          icon: {
            url: "http://maps.google.com/mapfiles/ms/icons/red-dot.png",
            scaledSize: new google.maps.Size(50, 50) // 마커 크기 크게
          },
        });
      },
      () => {
        alert("위치 정보를 허용하지 않으면 내 위치를 표시할 수 없습니다.");
      }
    );
  } else {
    alert("이 브라우저에서는 위치를 지원하지 않습니다.");
  }
}
</script>

<!-- Google Maps JavaScript API 키 필요 -->
<script async
  src="https://maps.googleapis.com/maps/api/js?key=YOUR_API_KEY&callback=initMap">
</script>

</body>
</html>
