<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hana Sushi Kiosk</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111;
  color: #fff;
}

/* 메인 화면 */
.screen {
  display: none;
  padding: 20px;
}

.active {
  display: block;
}

/* 카테고리 버튼 */
.grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.category-btn {
  background: #222;
  border-radius: 20px;
  padding: 40px;
  text-align: center;
  font-size: 28px;
  font-weight: bold;
  cursor: pointer;
}

.category-btn:active {
  background: #444;
}

/* 메뉴 아이템 */
.menu-item {
  background: #222;
  margin-bottom: 20px;
  border-radius: 20px;
  overflow: hidden;
}

.menu-item img {
  width: 100%;
  height: 220px;
  object-fit: cover;
}

.menu-info {
  padding: 15px;
}

.menu-name {
  font-size: 22px;
  margin-bottom: 10px;
}

.menu-price {
  font-size: 20px;
  color: #0f0;
}

.add-btn {
  margin-top: 10px;
  padding: 15px;
  width: 100%;
  font-size: 18px;
  background: orange;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

.add-btn:active {
  background: darkorange;
}

/* 상단 버튼 */
.top-bar {
  display: flex;
  justify-content: space-between;
  margin-bottom: 20px;
}

.top-btn {
  padding: 15px 25px;
  font-size: 18px;
  background: #333;
  border-radius: 10px;
  cursor: pointer;
}
</style>
</head>

<body>

<!-- 메인 -->
<div id="home" class="screen active">
  <h1>🍣 Hana Sushi</h1>

  <div class="grid">
    <div class="category-btn" onclick="showMenu('sushi')">🍣 Sushi</div>
    <div class="category-btn" onclick="showMenu('ramen')">🍜 Ramen</div>
    <div class="category-btn" onclick="showMenu('bento')">🍱 Bento</div>
    <div class="category-btn" onclick="showMenu('app')">🥟 Appetizer</div>
  </div>
</div>

<!-- 메뉴 -->
<div id="menu" class="screen">
  <div class="top-bar">
    <div class="top-btn" onclick="goHome()">⬅ Back</div>
    <div class="top-btn">🛒 Cart (0)</div>
  </div>

  <div id="menu-list"></div>
</div>

<script>
const data = {
  sushi: [
    {name: "Spicy Tuna Roll", price: "$5.00", img: "https://via.placeholder.com/400"},
    {name: "California Roll", price: "$5.00", img: "https://via.placeholder.com/400"}
  ],
  ramen: [
    {name: "Tonkotsu Ramen", price: "$9.99", img: "https://via.placeholder.com/400"}
  ],
  bento: [
    {name: "Chicken Bento", price: "$10.99", img: "https://via.placeholder.com/400"}
  ],
  app: [
    {name: "Gyoza", price: "$6.00", img: "https://via.placeholder.com/400"}
  ]
};

let cart = 0;

function showMenu(category) {
  document.getElementById("home").classList.remove("active");
  document.getElementById("menu").classList.add("active");

  const list = document.getElementById("menu-list");
  list.innerHTML = "";

  data[category].forEach(item => {
    list.innerHTML += `
      <div class="menu-item">
        <img src="${item.img}">
        <div class="menu-info">
          <div class="menu-name">${item.name}</div>
          <div class="menu-price">${item.price}</div>
          <button class="add-btn" onclick="addToCart()">Add</button>
        </div>
      </div>
    `;
  });
}

function goHome() {
  document.getElementById("menu").classList.remove("active");
  document.getElementById("home").classList.add("active"); 
}

function addToCart() {
  cart++;
  document.querySelector(".top-btn:last-child").innerText = "🛒 Cart (" + cart + ")";
}
</script>

</body>
</html>
